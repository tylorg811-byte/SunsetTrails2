<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sunset Trails Gallery Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Inter,sans-serif;
background:#0c0502;
color:white;
min-height:100vh;
background:
radial-gradient(circle at top left,rgba(255,179,71,.18),transparent 35%),
radial-gradient(circle at top right,rgba(255,211,138,.14),transparent 32%),
linear-gradient(135deg,#160904,#050201);
}
header{
padding:18px 6%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.42);
backdrop-filter:blur(14px);
border-bottom:1px solid rgba(255,200,120,.18);
position:sticky;
top:0;
z-index:50;
}
.logo{
font-family:'Playfair Display',serif;
font-size:24px;
color:#ffd38a;
}
.container{
padding:45px 6%;
max-width:1400px;
margin:auto;
}
h1,h2{
font-family:'Playfair Display',serif;
color:#ffd38a;
}
h1{
font-size:clamp(40px,6vw,72px);
line-height:1;
margin-bottom:10px;
}
.sub{
color:#f3d9b9;
line-height:1.7;
margin-bottom:28px;
}
.panel{
background:rgba(255,255,255,.07);
border:1px solid rgba(255,211,138,.18);
border-radius:24px;
padding:24px;
box-shadow:0 25px 70px rgba(0,0,0,.28);
backdrop-filter:blur(18px);
margin-bottom:22px;
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}
input,textarea,select{
width:100%;
padding:14px 15px;
border:none;
outline:none;
border-radius:13px;
background:rgba(255,255,255,.94);
font-family:Inter,sans-serif;
font-size:15px;
}
textarea{
min-height:100px;
resize:vertical;
}
label{
display:block;
font-size:14px;
font-weight:800;
color:#ffd38a;
margin-bottom:7px;
}
.field{
margin-bottom:15px;
}
button{
border:none;
cursor:pointer;
border-radius:999px;
padding:13px 20px;
font-weight:900;
background:linear-gradient(135deg,#ffd38a,#c77b28);
color:#1b0e04;
box-shadow:0 14px 34px rgba(199,123,40,.28);
}
.secondary{
background:rgba(255,255,255,.1);
color:white;
border:1px solid rgba(255,255,255,.18);
box-shadow:none;
}
.danger{
background:#932222;
color:white;
box-shadow:none;
}
.admin{
display:none;
}
.message{
margin-top:12px;
color:#ffd38a;
font-weight:800;
}
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-bottom:22px;
}
.stat{
background:rgba(255,255,255,.07);
border:1px solid rgba(255,211,138,.16);
border-radius:20px;
padding:18px;
}
.stat strong{
display:block;
font-size:30px;
color:#ffd38a;
}
.stat span{
font-size:13px;
color:#f3d9b9;
font-weight:800;
}
.gallery-list{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:16px;
}
.gallery-card{
background:rgba(255,255,255,.06);
border:1px solid rgba(255,211,138,.16);
border-radius:22px;
padding:20px;
}
.gallery-card h3{
font-family:'Playfair Display',serif;
font-size:25px;
color:#ffd38a;
margin-bottom:6px;
}
.gallery-card p{
color:#f3d9b9;
font-size:14px;
line-height:1.6;
}
.code{
display:inline-block;
margin:10px 0;
padding:7px 12px;
border-radius:999px;
background:rgba(255,211,138,.14);
color:#ffd38a;
font-weight:900;
font-size:13px;
}
.actions{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-top:12px;
}
.photos{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(130px,160px));
gap:11px;
margin-top:16px;
}
.photo{
width:160px;
aspect-ratio:1/1;
border-radius:15px;
overflow:hidden;
position:relative;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.12);
}
.photo img{
width:100%;
height:100%;
object-fit:cover;
display:block;
cursor:pointer;
}
.badge{
position:absolute;
top:8px;
left:8px;
background:rgba(0,0,0,.7);
color:#ffd38a;
font-size:11px;
font-weight:900;
padding:5px 8px;
border-radius:999px;
}
.photo button{
position:absolute;
bottom:0;
left:0;
width:100%;
border-radius:0;
padding:8px;
font-size:12px;
background:rgba(147,34,34,.95);
color:white;
}
.list{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}
.item{
background:rgba(255,255,255,.06);
border:1px solid rgba(255,211,138,.14);
border-radius:18px;
padding:16px;
}
.item strong{
color:#ffd38a;
}
.item p{
color:#f3d9b9;
font-size:14px;
line-height:1.5;
margin-top:5px;
}
.item img{
width:120px;
height:120px;
object-fit:cover;
border-radius:14px;
margin-top:10px;
}
.viewer{
position:fixed;
inset:0;
background:rgba(0,0,0,.94);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
padding:25px;
}
.viewer-box{
max-width:92%;
text-align:center;
}
.viewer-box img{
max-width:100%;
max-height:62vh;
object-fit:contain;
border-radius:20px;
box-shadow:0 30px 80px rgba(0,0,0,.6);
}
.viewer-box p{
color:#ffd38a;
font-weight:900;
margin-top:12px;
}
.close{
position:absolute;
top:20px;
right:28px;
font-size:44px;
color:white;
cursor:pointer;
}
.arrow{
position:absolute;
top:50%;
