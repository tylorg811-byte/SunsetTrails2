<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Gallery | Sunset Trails Photography</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=USD"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Inter;
background:#0d0703;
color:white;
background:radial-gradient(circle at top,#7a3d14,#0d0703 60%);
}

header{
padding:20px;
text-align:center;
font-family:'Playfair Display';
font-size:28px;
color:#ffd38a;
}

.hero{
text-align:center;
padding:60px 20px;
}

.hero h1{
font-size:50px;
color:#ffd38a;
}

.box{
max-width:500px;
margin:30px auto;
background:rgba(255,255,255,.1);
padding:25px;
border-radius:20px;
}

input{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:10px;
}

button{
padding:12px;
border:none;
border-radius:999px;
background:#ffd38a;
font-weight:bold;
cursor:pointer;
}

.gallery{
display:none;
padding:30px;
}

.album-section{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:30px;
}

.album-card{
background:rgba(255,255,255,.1);
padding:20px;
border-radius:20px;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:15px;
}

.card{
background:rgba(255,255,255,.08);
border-radius:15px;
overflow:hidden;
}

.image{
position:relative;
height:260px;
}

.image img{
width:100%;
height:100%;
object-fit:cover;
}

.watermark{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) rotate(-20deg);
color:rgba(255,255,255,.3);
font-size:28px;
}

.heart{
position:absolute;
top:10px;
right:10px;
background:black;
width:35px;
height:35px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.actions{
padding:10px;
display:grid;
gap:6px;
}

.cart{
position:fixed;
bottom:20px;
right:20px;
background:#ffd38a;
color:black;
padding:12px 20px;
border-radius:999px;
font-weight:bold;
}
</style>
</head>

<body>

<header>Sunset Trails Photography</header>

<div class="hero">
<h1>Client Gallery</h1>
<p>Select favorites and purchase your photos</p>
</div>

<div class="box" id="loginBox">
<input id="code" placeholder="Gallery Code">
<input id="name" placeholder="Your Name">
<input id="email" placeholder="Your Email">
<button onclick="loadGallery()">Open Gallery</button>
</div>

<div class="gallery" id="gallery">

<div class="album-section">

<div class="album-card">
<h3>Full Gallery</h3>
<p>All edited images</p>
<button onclick="addFullGallery()">Buy - $<span id="fullPrice"></span></button>
</div>

<div class="album-card">
<h3>Album Package</h3>
<p>Curated premium selection</p>
<button onclick="addAlbum()">Buy - $<span id="albumPrice"></span></button>
</div>

</div>

<div id="grid" class="grid"></div>
</div>

<div class="cart" onclick="checkout()">Checkout</div>

<script>
const supabaseClient = supabase.createClient(
"https://mcjqykkjyvhcqlfjwzpo.supabase.co",
"sb_publishable_FUd4Y2AZi3dKEO_mGwnjxA_Ixrjv0v8"
);

let photos=[];
let favorites=new Set();
let cart=[];
let currentGallery=null;

async function loadGallery(){
const code=document.getElementById("code").value.toUpperCase();

const {data:gallery}=await supabaseClient
.from("client_galleries")
.select("*")
.eq("gallery_code",code)
.single();

currentGallery=gallery;

document.getElementById("fullPrice").innerText=gallery.full_gallery_price||0;
document.getElementById("albumPrice").innerText=gallery.album_price||0;

const {data}=await supabaseClient
.from("gallery_photos")
.select("*")
.eq("gallery_id",gallery.id);

photos=data;

document.getElementById("loginBox").style.display="none";
document.getElementById("gallery").style.display="block";

render();
}

function render(){
const grid=document.getElementById("grid");
grid.innerHTML="";

photos.forEach(p=>{
const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<div class="image">
<img src="${p.image_url}">
${!p.is_approved ? `<div class="watermark">Sunset Trails</div>`:""}
<div class="heart" onclick="toggleFav('${p.id}')">♥</div>
</div>

<div class="actions">
${p.price ? `$${p.price}`:""}
<button onclick="addToCart('${p.id}')">Add</button>
</div>
`;

grid.appendChild(div);
});
}

function toggleFav(id){
favorites.has(id)?favorites.delete(id):favorites.add(id);
}

function addToCart(id){
const p=photos.find(x=>x.id===id);
cart.push(p);
}

function addFullGallery(){
cart.push({
id:"full_gallery",
price:Number(currentGallery.full_gallery_price),
caption:"Full Gallery"
});
}

function addAlbum(){
cart.push({
id:"album_package",
price:Number(currentGallery.album_price),
caption:"Album Package"
});
}

function checkout(){
alert("Connect PayPal to enable checkout");
}
</script>

</body>
</html>
