<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sunset Trails Client Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- PAYPAL (leave until ready) -->
<script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=USD"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Inter,sans-serif;
background:#0c0502;
color:white;
background:
radial-gradient(circle at top,#7a3d14,#0c0502 60%);
}

/* HEADER */
header{
padding:18px 6%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.4);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,200,120,.2);
position:sticky;
top:0;
z-index:10;
}

.logo{
font-family:'Playfair Display',serif;
font-size:22px;
color:#ffd38a;
}

/* HERO */
.hero{
text-align:center;
padding:70px 20px 30px;
}

.hero h1{
font-family:'Playfair Display',serif;
font-size:clamp(40px,6vw,70px);
color:#ffd38a;
}

.hero p{
margin-top:12px;
color:#f3d9b9;
}

/* LOGIN BOX */
.box{
max-width:500px;
margin:40px auto;
background:rgba(255,255,255,.08);
padding:25px;
border-radius:20px;
border:1px solid rgba(255,255,255,.1);
}

input{
width:100%;
padding:14px;
margin-bottom:12px;
border:none;
border-radius:10px;
}

button{
padding:12px 20px;
border:none;
border-radius:999px;
background:#ffb347;
font-weight:bold;
cursor:pointer;
}

.gallery{
display:none;
padding:30px 5%;
}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
margin-bottom:20px;
gap:10px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:16px;
}

/* CARD */
.card{
background:rgba(255,255,255,.05);
border-radius:16px;
overflow:hidden;
border:1px solid rgba(255,255,255,.1);
}

.image{
position:relative;
height:260px;
}

.image img{
width:100%;
height:100%;
object-fit:cover;
}

/* WATERMARK */
.watermark{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) rotate(-20deg);
font-size:28px;
color:rgba(255,255,255,.3);
pointer-events:none;
}

/* STATUS */
.status{
position:absolute;
top:8px;
left:8px;
background:rgba(0,0,0,.6);
padding:5px 10px;
border-radius:20px;
font-size:12px;
color:#ffd38a;
}

/* FAVORITE */
.heart{
position:absolute;
top:8px;
right:8px;
background:rgba(0,0,0,.6);
width:38px;
height:38px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.heart.active{
background:#ffd38a;
color:black;
}

/* ACTIONS */
.actions{
padding:12px;
display:grid;
gap:8px;
}

.small{
font-size:13px;
opacity:.9;
}

/* LIGHTBOX */
.viewer{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:none;
align-items:center;
justify-content:center;
}

.viewer img{
max-width:90%;
max-height:80vh;
}

/* CART */
.cart{
position:fixed;
bottom:20px;
right:20px;
background:#ffd38a;
color:black;
padding:12px 20px;
border-radius:999px;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<div class="logo">Sunset Trails Photography</div>
</header>

<div class="hero">
<h1>Client Gallery</h1>
<p>View your photos, select favorites, and purchase your favorites.</p>
</div>

<div class="box" id="loginBox">
<input id="code" placeholder="Enter Gallery Code">
<input id="name" placeholder="Your Name">
<input id="email" placeholder="Your Email">
<button onclick="loadGallery()">Open Gallery</button>
</div>

<div class="gallery" id="gallery">
<div class="topbar">
<div id="info"></div>
<div>
<span id="favCount">0 favorites</span> |
<span id="cartTotal">$0</span>
</div>
</div>

<div class="grid" id="grid"></div>
</div>

<div class="viewer" id="viewer" onclick="closeViewer()">
<img id="viewerImg">
</div>

<div class="cart" onclick="checkout()">
Checkout
</div>

<script>
const supabaseClient = supabase.createClient("YOUR_SUPABASE_URL","YOUR_SUPABASE_ANON_KEY");

let photos=[];
let favorites=new Set();
let cart=[];

async function loadGallery(){
const code=document.getElementById("code").value.toUpperCase();

const {data:gallery}=await supabaseClient
.from("client_galleries")
.select("*")
.eq("gallery_code",code)
.single();

const {data}=await supabaseClient
.from("gallery_photos")
.select("*")
.eq("gallery_id",gallery.id);

photos=data;

document.getElementById("loginBox").style.display="none";
document.getElementById("gallery").style.display="block";
document.getElementById("info").innerText=gallery.client_name;

render();
}

function render(){
const grid=document.getElementById("grid");
grid.innerHTML="";

photos.forEach((p,i)=>{

const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<div class="image" onclick="openViewer('${p.image_url}')">
<img src="${p.image_url}">
${!p.is_approved ? `<div class="watermark">Sunset Trails</div>` : ""}
<div class="status">${p.is_approved?"Final":"Proof"}</div>
<div class="heart ${favorites.has(p.id)?"active":""}" onclick="event.stopPropagation();toggleFav('${p.id}')">♥</div>
</div>

<div class="actions">
<div class="small">${p.caption||""}</div>
${p.price ? `<div>$${p.price}</div>`:""}
<button onclick="addToCart('${p.id}')">Add to Cart</button>
</div>
`;

grid.appendChild(div);
});

document.getElementById("favCount").innerText=favorites.size+" favorites";
document.getElementById("cartTotal").innerText="$"+cart.reduce((a,b)=>a+b.price,0);
}

function toggleFav(id){
if(favorites.has(id)) favorites.delete(id);
else favorites.add(id);
render();
}

function addToCart(id){
const p=photos.find(x=>x.id===id);
cart.push(p);
render();
}

function openViewer(src){
document.getElementById("viewerImg").src=src;
document.getElementById("viewer").style.display="flex";
}

function closeViewer(){
document.getElementById("viewer").style.display="none";
}

function checkout(){
alert("Connect PayPal next");
}
</script>

</body>
</html>
