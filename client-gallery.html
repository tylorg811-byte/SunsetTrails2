<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Gallery | Sunset Trails Photography</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Private client gallery for Sunset Trails Photography.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#120b05;color:white;min-height:100vh;background:linear-gradient(rgba(18,11,5,.72),rgba(18,11,5,.94)),url('sunset-bg.jpg') center/cover fixed}
header{padding:22px 7%;display:flex;justify-content:space-between;align-items:center;background:rgba(20,12,5,.55);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,204,120,.18);position:sticky;top:0;z-index:10}
.logo{font-family:'Playfair Display',serif;font-size:25px;color:#ffd38a}
header a{color:white;text-decoration:none;font-size:14px;opacity:.85}
.hero{padding:90px 7% 55px;text-align:center}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(42px,7vw,82px);line-height:1;color:#ffd38a}
.hero p{max-width:720px;margin:20px auto 0;color:#f5dcc0;line-height:1.7}
.access-box,.client-info-box{width:min(620px,90%);margin:0 auto 65px;padding:30px;border-radius:28px;background:rgba(255,255,255,.08);border:1px solid rgba(255,211,138,.25);box-shadow:0 30px 80px rgba(0,0,0,.35);backdrop-filter:blur(18px)}
label{display:block;font-weight:800;color:#ffd38a;margin-bottom:10px}
input,textarea{width:100%;padding:17px 18px;border:none;outline:none;border-radius:16px;background:rgba(255,255,255,.92);font-size:16px;margin-bottom:14px;font-family:Inter,sans-serif}
textarea{min-height:110px;resize:vertical}
button{border:none;cursor:pointer;border-radius:999px;padding:15px 24px;font-weight:900;background:linear-gradient(135deg,#ffd38a,#c77b28);color:#1b0e04;box-shadow:0 15px 35px rgba(199,123,40,.32)}
.access-box button{width:100%;font-size:16px}
.message{margin-top:14px;text-align:center;color:#ffd38a;font-weight:800}
.gallery-wrap{display:none;padding:10px 7% 80px}
.gallery-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:28px}
.gallery-top h2{font-family:'Playfair Display',serif;font-size:clamp(34px,5vw,58px);color:#ffd38a}
.gallery-top p{color:#f7dfbf;margin-top:8px;max-width:720px;line-height:1.6}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.secondary{background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.2);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,211,138,.18);border-radius:24px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.image-wrap{position:relative;height:320px;overflow:hidden;cursor:pointer}
.image-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.watermark-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.watermark-overlay span{font-family:'Playfair Display',serif;font-size:clamp(26px,4vw,54px);font-weight:800;color:rgba(255,255,255,.34);transform:rotate(-22deg);text-shadow:0 2px 15px rgba(0,0,0,.4);letter-spacing:2px}
.status{position:absolute;top:12px;left:12px;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.68);color:#ffd38a;font-size:12px;font-weight:900}
.card-content{padding:16px}
.card-content p{color:#f3d9b9;font-size:14px;margin-bottom:14px;line-height:1.5}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card-actions button,.card-actions a{text-align:center;text-decoration:none;border-radius:999px;padding:12px;font-weight:900;font-size:13px}
.card-actions a{display:block}
.view{background:rgba(255,255,255,.12);color:white;border:1px solid rgba(255,255,255,.18);box-shadow:none}
.download{background:linear-gradient(135deg,#ffd38a,#c77b28);color:#1b0e04}
.locked{opacity:.65;pointer-events:none}
.empty{text-align:center;padding:50px;color:#f5dcc0;border:1px dashed rgba(255,211,138,.25);border-radius:24px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:99;padding:25px}
.viewer-box{max-width:92%;text-align:center;position:relative}
.viewer-box img{max-width:100%;max-height:78vh;border-radius:20px;object-fit:contain}
.viewer-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.viewer-watermark span{font-family:'Playfair Display',serif;font-size:clamp(36px,8vw,92px);font-weight:800;color:rgba(255,255,255,.28);transform:rotate(-22deg);letter-spacing:4px;text-shadow:0 3px 20px rgba(0,0,0,.55)}
.close{position:absolute;top:22px;right:25px;font-size:42px;color:white;cursor:pointer}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;font-size:40px;line-height:1;display:flex;align-items:center;justify-content:center;background:rgba(255,211,138,.18);color:#ffd38a;border:1px solid rgba(255,211,138,.35);box-shadow:none}
.arrow.left{left:18px}.arrow.right{right:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:120;display:none;align-items:center;justify-content:center;padding:20px}
.modal-box{width:min(560px,94%);background:#1a1008;border:1px solid rgba(255,211,138,.25);border-radius:28px;padding:28px;box-shadow:0 30px 90px rgba(0,0,0,.55)}
.modal-box h3{font-family:'Playfair Display',serif;color:#ffd38a;font-size:32px;margin-bottom:12px}
.modal-box p{color:#f3d9b9;line-height:1.6;margin-bottom:15px}
@media(max-width:900px){.gallery-top{display:block}.actions{margin-top:18px}.grid{grid-template-columns:1fr 1fr}.image-wrap{height:260px}}
@media(max-width:600px){header{padding:18px 5%}.hero{padding:70px 5% 40px}.gallery-wrap{padding:10px 5% 60px}.grid{grid-template-columns:1fr}.image-wrap{height:300px}.arrow{width:44px;height:44px;font-size:32px}.arrow.left{left:8px}.arrow.right{right:8px}}
</style>
</head>

<body>

<header>
<div class="logo">Sunset Trails Photography</div>
<a href="index.html">Back to Website</a>
</header>

<section class="hero">
<h1>Private Client Gallery</h1>
<p>Enter your gallery access code to view your proofs, download approved finals, and request additional prints.</p>
</section>

<div class="access-box" id="accessBox">
<label>Gallery Access Code</label>
<input id="codeInput" placeholder="Example: SUNSET-JONES-2026">
<label>Your Name</label>
<input id="clientNameInput" placeholder="Your name">
<label>Your Email</label>
<input id="clientEmailInput" type="email" placeholder="you@email.com">
<button onclick="loadGallery()">Open My Gallery</button>
<div class="message" id="message"></div>
</div>

<section class="gallery-wrap" id="galleryWrap">
<div class="gallery-top">
<div>
<h2 id="clientName">Client Gallery</h2>
<p id="galleryNotes"></p>
</div>
<div class="actions">
<button class="secondary" onclick="resetGallery()">Enter Different Code</button>
<a id="paymentBtn" href="#" target="_blank" style="display:none;text-decoration:none;"><button>Purchase / Pay Online</button></a>
</div>
</div>
<div class="grid" id="photoGrid"></div>
</section>

<div class="lightbox" id="lightbox">
<span class="close" onclick="closeLightbox()">×</span>
<button class="arrow left" onclick="prevPhoto()">‹</button>
<div class="viewer-box">
<img id="lightboxImg">
<div class="viewer-watermark" id="viewerWatermark"><span>Sunset Trails</span></div>
<p id="viewerCount" style="color:#ffd38a;font-weight:900;margin-top:12px;"></p>
</div>
<button class="arrow right" onclick="nextPhoto()">›</button>
</div>

<div class="modal" id="requestModal">
<div class="modal-box">
<h3>Request This Photo</h3>
<p id="requestPhotoText">Send a request for extra prints, edits, or purchase details.</p>
<label>Request Type</label>
<input id="requestType" placeholder="Extra print / Digital copy / More edits">
<label>Message</label>
<textarea id="requestMessage" placeholder="Example: I would like an 8x10 print of this photo."></textarea>
<button onclick="submitRequest()">Send Request</button>
<button class="secondary" onclick="closeRequestModal()" style="margin-left:8px;">Cancel</button>
<div class="message" id="requestStatus"></div>
</div>
</div>

<script>
const SUPABASE_URL = "https://mcjqykkjyvhcqlfjwzpo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_FUd4Y2AZi3dKEO_mGwnjxA_Ixrjv0v8";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentGallery = null;
let currentPhotos = [];
let currentIndex = 0;
let selectedPhoto = null;
let touchStartX = 0;
let touchEndX = 0;

async function loadGallery(){
const code=document.getElementById("codeInput").value.trim().toUpperCase();
const message=document.getElementById("message");
const grid=document.getElementById("photoGrid");
message.textContent="";
grid.innerHTML="";
if(!code){message.textContent="Please enter your gallery code.";return;}

const { data:gallery,error } = await supabaseClient.from("client_galleries").select("*").eq("gallery_code",code).eq("is_active",true).single();
if(error||!gallery){message.textContent="No active gallery found with that code.";return;}
currentGallery=gallery;

const { data:photos,error:photoError } = await supabaseClient.from("gallery_photos").select("*").eq("gallery_id",gallery.id).order("created_at",{ascending:true});

document.getElementById("clientName").textContent=gallery.client_name+" Gallery";
document.getElementById("galleryNotes").textContent=gallery.notes||"Proof images may include a watermark. Approved final images can be downloaded.";
if(gallery.payment_link){document.getElementById("paymentBtn").style.display="inline-block";document.getElementById("paymentBtn").href=gallery.payment_link;}else{document.getElementById("paymentBtn").style.display="none";}
document.getElementById("accessBox").style.display="none";
document.getElementById("galleryWrap").style.display="block";

if(photoError||!photos||!photos.length){grid.innerHTML=`<div class="empty">No photos have been uploaded yet.</div>`;return;}
currentPhotos=photos;

photos.forEach((photo,index)=>{
const isProof=!photo.is_approved;
const showWatermark=photo.watermark_enabled && isProof;
const card=document.createElement("div");
card.className="card";
card.innerHTML=`
<div class="image-wrap" onclick="openLightbox(${index})">
<img src="${photo.image_url}" alt="${photo.caption || 'Client photo'}">
${showWatermark ? `<div class="watermark-overlay"><span>Sunset Trails</span></div>` : ""}
<span class="status">${photo.is_approved ? "Approved Final" : "Proof"}</span>
</div>
<div class="card-content">
<p>${photo.caption || "Sunset Trails Photography"}</p>
${photo.price && photo.price > 0 ? `<p><b>Additional purchase:</b> $${Number(photo.price).toFixed(2)}</p>` : ""}
<div class="card-actions">
<button class="view" onclick="openLightbox(${index})">View</button>
${photo.is_approved ? `<a class="download" href="${photo.image_url}" download>Download</a>` : `<button class="download locked">Download Locked</button>`}
<button class="view" onclick="openRequestModal(${index},'Extra Print')">Request Print</button>
<button class="download" onclick="openRequestModal(${index},'Purchase Photo')">Purchase</button>
</div>
</div>
`;
grid.appendChild(card);
});
}

function resetGallery(){
document.getElementById("galleryWrap").style.display="none";
document.getElementById("accessBox").style.display="block";
document.getElementById("codeInput").value="";
currentGallery=null;
currentPhotos=[];
}

function openLightbox(index){
currentIndex=index;
const photo=currentPhotos[currentIndex];
document.getElementById("lightboxImg").src=photo.image_url;
document.getElementById("viewerCount").textContent=(currentIndex+1)+" / "+currentPhotos.length+" — "+(photo.is_approved?"Approved Final":"Proof");
document.getElementById("viewerWatermark").style.display=(photo.watermark_enabled&&!photo.is_approved)?"flex":"none";
document.getElementById("lightbox").style.display="flex";
}

function closeLightbox(){document.getElementById("lightbox").style.display="none";}
function nextPhoto(){if(!currentPhotos.length)return;currentIndex++;if(currentIndex>=currentPhotos.length)currentIndex=0;openLightbox(currentIndex);}
function prevPhoto(){if(!currentPhotos.length)return;currentIndex--;if(currentIndex<0)currentIndex=currentPhotos.length-1;openLightbox(currentIndex);}

function openRequestModal(index,type){
selectedPhoto=currentPhotos[index];
document.getElementById("requestType").value=type;
document.getElementById("requestMessage").value="";
document.getElementById("requestStatus").textContent="";
document.getElementById("requestPhotoText").textContent=`Requesting: ${selectedPhoto.caption || "Photo"}${selectedPhoto.price && selectedPhoto.price>0 ? " — $" + Number(selectedPhoto.price).toFixed(2) : ""}`;
document.getElementById("requestModal").style.display="flex";
}

function closeRequestModal(){document.getElementById("requestModal").style.display="none";}

async function submitRequest(){
const client_name=document.getElementById("clientNameInput").value.trim();
const client_email=document.getElementById("clientEmailInput").value.trim();
const request_type=document.getElementById("requestType").value.trim();
const message=document.getElementById("requestMessage").value.trim();
const status=document.getElementById("requestStatus");
status.textContent="";
if(!currentGallery||!selectedPhoto){status.textContent="No photo selected.";return;}
if(!client_name||!client_email){status.textContent="Please enter your name and email before sending a request.";return;}
if(!request_type){status.textContent="Please enter a request type.";return;}

const { error } = await supabaseClient.from("gallery_requests").insert([{
gallery_id:currentGallery.id,
photo_id:selectedPhoto.id,
client_name,
client_email,
request_type,
message
}]);

if(error){status.textContent=error.message;return;}
status.textContent="Request sent successfully.";
setTimeout(closeRequestModal,900);
}

document.addEventListener("keydown",e=>{
if(document.getElementById("lightbox").style.display!=="flex")return;
if(e.key==="ArrowRight")nextPhoto();
if(e.key==="ArrowLeft")prevPhoto();
if(e.key==="Escape")closeLightbox();
});

document.querySelector(".viewer-box").addEventListener("touchstart",e=>{touchStartX=e.changedTouches[0].screenX;});
document.querySelector(".viewer-box").addEventListener("touchend",e=>{touchEndX=e.changedTouches[0].screenX;const diff=touchStartX-touchEndX;if(Math.abs(diff)<50)return;if(diff>0)nextPhoto();else prevPhoto();});
</script>

</body>
</html>
